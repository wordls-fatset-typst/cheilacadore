<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheila Cadore · Psicóloga</title>
<style>
:root{--bg:#a3775d;--ink:#f0e8e5;--accent:#f0e8e5;--card:#ae8369;--line:#c29d86;--btn:#f0e8e5;--btnt:#72440f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#a3775d;--ink:#f0e8e5;--accent:#f0e8e5;--card:#ae8369;--line:#c29d86;--btn:#f0e8e5;--btnt:#72440f}}
:root[data-theme="dark"]{--bg:#a3775d;--ink:#f0e8e5;--accent:#f0e8e5;--card:#ae8369;--line:#c29d86;--btn:#f0e8e5;--btnt:#72440f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto}
.hero{position:relative;aspect-ratio:4/5;overflow:hidden;margin-top:calc(-1*env(safe-area-inset-top,0px));border-radius:0 0 28px 28px}
.hero img.f{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(40,28,26,.72) 100%)}
.hero img.l{position:absolute;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);width:62%}
.crp{text-align:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin:22px 0 6px;color:var(--accent)}
.sub{text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:20px;margin:0 24px 22px}
.sub b{color:var(--accent);font-weight:600}
.list{padding:0 20px 40px;display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.main{width:100%;display:flex;align-items:center;gap:14px;padding:18px;background:var(--btn);color:var(--btnt);border:0;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-align:left}
.main svg{width:24px;height:24px;flex:none}
.main .ch{margin-left:auto;transition:transform .3s}
.item.open .ch{transform:rotate(180deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.item.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.opts{padding:12px;display:grid;gap:8px}
.opts a{display:block;padding:14px 16px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
.opts a small{display:block;opacity:.7;font-size:13px;margin-top:2px}
.opts a:active,.opts a:hover{background:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><div class="wrap">
